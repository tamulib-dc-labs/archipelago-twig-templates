name: Registry drift

# Guards the Twig linter's one SILENT failure mode.
#
# tools/twig-lint/registry/extensions.json lists the Twig names the linter
# trusts. If a name in there does not actually exist in the deployed
# Archipelago, the linter accepts templates Archipelago will reject -- a green
# build over a manifest that renders empty to the public. Nothing about that
# failure is loud, so it needs its own check.
#
# This job fetches the upstream module sources pinned in registry/sources.json
# and confirms every registered name is really declared there.
#
# LIMIT: it can only see the upstream modules we listed. It cannot see a
# TAMU-local module, which is why site-local names are marked scan_exempt.
# To settle those, run tools/twig-lint/bin/dump-twig-names.php against the
# deployed site -- see tools/twig-lint/README.md.
#
# NO MARKETPLACE ACTIONS. actions/checkout is published by GitHub itself; git,
# PHP and Composer are all preinstalled on the runner.

on:
  schedule:
    # Mondays, 06:00 UTC. Scheduled runs only fire from the default branch, so
    # this takes effect once merged to main.
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'tools/twig-lint/registry/**'
      - '.github/workflows/registry-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Registry matches upstream
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          php -v
          composer --version
          git --version

      - name: Install dependencies
        working-directory: tools/twig-lint
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Fetch upstream module sources and scan them
        run: php tools/twig-lint/bin/build-dump.php --out=upstream-dump.json

      - name: Compare against the registry
        run: |
          php tools/twig-lint/bin/compare-registry.php upstream-dump.json \
            --format=github \
            --summary="$GITHUB_STEP_SUMMARY"

      # Kept so a failed run can be diffed against the previous one to see
      # exactly what upstream changed.
      - name: Upload the dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-twig-names
          path: upstream-dump.json
          retention-days: 30
