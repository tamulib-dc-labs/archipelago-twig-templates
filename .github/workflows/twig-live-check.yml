name: Twig live check

# Asks the DEPLOYED Archipelago whether it would accept the templates in this
# PR, by saving each one as a temporary Metadata Display entity and deleting it
# again. The twig field carries format_strawberryfield's TwigTemplateConstraint,
# so a POST runs the same validation the entity edit form runs: 201 accepted,
# 422 rejected.
#
# This is the authoritative counterpart to `Twig lint`, which reproduces the
# same gate offline from a hand-maintained registry of extension names. Keep
# both. They answer different halves of the question:
#
#   offline lint  ->  WHERE the problem is (line number, message)
#   live check    ->  WHETHER this site really accepts it (no registry involved)
#
# Their disagreements are the valuable part. If the offline linter passes a file
# this job rejects, the registry trusts a Twig name the site does not actually
# have -- the false-pass that tools/twig-lint/README.md calls its one silent
# failure mode. validate-live.php detects that case and says so explicitly.
#
# ---------------------------------------------------------------------------
# REQUIREMENTS -- this job cannot run on a GitHub-hosted runner.
#
# archipelago-dev.library.tamu.edu is reachable only from the campus network,
# and GitHub's hosted runners are not on it. This needs a SELF-HOSTED runner
# with line of sight to the host, labelled `archipelago-campus`, with php-cli
# (8.2+) and ext-curl installed.
#
# Until that runner exists this workflow is INERT: every job is gated on the
# repository variable ARCHIPELAGO_LIVE_ENABLED being "true", so PRs do not sit
# with a check that can never start. Set it once the runner is registered:
#
#   gh variable set ARCHIPELAGO_LIVE_ENABLED --body true
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#   ARCHIPELAGO_URL    https://archipelago-dev.library.tamu.edu/
#   ARCHIPELAGO_USER   a dedicated CI account -- see the note below
#   ARCHIPELAGO_PASS
#
# Do NOT use the default admin/archipelago pair. Create an account whose role
# can create, validate and delete Metadata Display entities and nothing else.
# If CI credentials leak, that is the whole blast radius.
# ---------------------------------------------------------------------------

on:
  pull_request:
    paths:
      - 'twig/**'
      - 'tools/twig-live/**'
      - 'tools/twig-lint/registry/**'
      - '.github/workflows/twig-live-check.yml'
  schedule:
    # Tuesdays, 06:00 UTC -- a day after registry-drift.yml, so the upstream
    # scan and this live verification do not land in the same inbox.
    - cron: '0 6 * * 2'
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which templates to validate'
        type: choice
        default: changed
        options: [changed, all]

permissions:
  contents: read

concurrency:
  # Probe entities are uniquely named per run, so a cancelled run cannot
  # collide with a live one. Anything it orphans is cleared by the sweep step.
  group: twig-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-validate:
    name: Live validateSource
    # Fork PRs cannot read secrets, and this job is meaningless without them.
    # Skipping is correct: the offline `Twig lint` job still covers those PRs.
    if: >-
      vars.ARCHIPELAGO_LIVE_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, archipelago-campus]
    timeout-minutes: 15

    env:
      ARCHIPELAGO_URL: ${{ secrets.ARCHIPELAGO_URL }}
      ARCHIPELAGO_USER: ${{ secrets.ARCHIPELAGO_USER }}
      ARCHIPELAGO_PASS: ${{ secrets.ARCHIPELAGO_PASS }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # validate-live.php --changed diffs against the base branch, which
          # has to actually be in the clone.
          fetch-depth: 0

      - name: Show toolchain
        run: |
          php -v
          php -r 'exit(extension_loaded("curl") ? 0 : 1);' || {
            echo "::error::ext-curl is not enabled on this runner. The live check needs it."
            exit 1
          }

      # Cheap, and it fails with a clear message instead of 20 confusing ones
      # if the runner has lost its route to campus or the secrets are stale.
      - name: Confirm the site is reachable and the credentials work
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -u "$ARCHIPELAGO_USER:$ARCHIPELAGO_PASS" \
            "${ARCHIPELAGO_URL%/}/jsonapi/metadatadisplay_entity/metadatadisplay_entity?page%5Blimit%5D=1")
          echo "JSON:API responded $status"
          case "$status" in
            200) ;;
            401|403) echo "::error::Authentication failed. Check ARCHIPELAGO_USER / ARCHIPELAGO_PASS."; exit 1 ;;
            000) echo "::error::No response. This runner cannot reach ${ARCHIPELAGO_URL}."; exit 1 ;;
            *)   echo "::error::Unexpected status $status from JSON:API."; exit 1 ;;
          esac

      # Clears probe entities orphaned by a run that was cancelled or killed
      # before its cleanup handler could fire. Only touches names carrying the
      # zzz-ci-probe-DELETE-ME- prefix, and only those older than an hour, so a
      # concurrent run's probes are never taken out from under it.
      - name: Sweep orphaned probe entities
        run: php tools/twig-live/bin/validate-live.php --sweep

      # Lets validate-live.php cross-check its verdict against the offline
      # linter and flag registry false-passes. If this fails -- no composer, no
      # packagist -- the cross-check degrades to "not consulted" and the live
      # verdict still stands on its own.
      - name: Install the offline linter (for cross-checking)
        continue-on-error: true
        working-directory: tools/twig-lint
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate changed templates against the live site
        if: github.event_name == 'pull_request' || inputs.scope == 'changed'
        run: |
          php tools/twig-live/bin/validate-live.php \
            --changed="origin/${{ github.base_ref || github.event.repository.default_branch }}" \
            --format=github \
            --summary="$GITHUB_STEP_SUMMARY"

      - name: Validate every template against the live site
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'all'
        run: |
          php tools/twig-live/bin/validate-live.php \
            --format=github \
            --summary="$GITHUB_STEP_SUMMARY"

      # Reports only. Most of this repo currently differs from archipelago-dev,
      # so gating on drift would be noise. Add --strict once the two are
      # reconciled and it becomes a real check.
      - name: Report drift between this repo and the deployed site
        if: always()
        run: |
          php tools/twig-live/bin/drift-check.php \
            --format=github \
            --summary="$GITHUB_STEP_SUMMARY"

      # Belt and braces: the script deletes its own probes, and this catches
      # anything a mid-step failure left behind.
      - name: Final sweep
        if: always()
        run: php tools/twig-live/bin/validate-live.php --sweep --sweep-age=0

  # Confirms every name tools/twig-lint trusts actually exists on the site.
  #
  # registry-drift.yml already checks the registry against upstream module
  # SOURCE, but source cannot tell you whether a module is installed here.
  # Both currently disagree, and the disagreement is the point: the upstream
  # scan reports "0 missing, no false-pass risk" while this job proves that
  # sbf_datacite and allmaps_annotation_url do not exist on archipelago-dev.
  verify-registry:
    name: Registry exists on the live site
    if: >-
      vars.ARCHIPELAGO_LIVE_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, archipelago-campus]
    timeout-minutes: 15

    env:
      ARCHIPELAGO_URL: ${{ secrets.ARCHIPELAGO_URL }}
      ARCHIPELAGO_USER: ${{ secrets.ARCHIPELAGO_USER }}
      ARCHIPELAGO_PASS: ${{ secrets.ARCHIPELAGO_PASS }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: php -v

      - name: Sweep orphaned probe entities
        run: php tools/twig-live/bin/validate-live.php --sweep

      - name: Verify every registered name against the site
        run: |
          php tools/twig-live/bin/verify-registry-live.php \
            --format=github \
            --summary="$GITHUB_STEP_SUMMARY"

      - name: Final sweep
        if: always()
        run: php tools/twig-live/bin/validate-live.php --sweep --sweep-age=0
